name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          mkdir proj
          unzip -q ./*.zip -d proj
      - name: Download fonts
        working-directory: proj
        run: |
          mkdir -p app/src/main/assets/www/fonts
          cd app/src/main/assets/www/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o Lalezar-Regular.ttf "$base/lalezar/Lalezar-Regular.ttf" || true
          curl -fsSL -o Tajawal-Medium.ttf "$base/tajawal/Tajawal-Medium.ttf" || true
          curl -fsSL -o Tajawal-Bold.ttf "$base/tajawal/Tajawal-Bold.ttf" || true
          curl -fsSL -o PressStart2P-Regular.ttf "$base/pressstart2p/PressStart2P-Regular.ttf" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hudhud-desert-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
